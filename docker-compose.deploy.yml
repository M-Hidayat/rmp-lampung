# Deployment produksi RMP Lampung di VPS bersama serbamager.
#
# Arsitektur: nginx serbamager (sudah memegang port 80/443) menjadi reverse
# proxy untuk RMP. Karena itu stack ini TIDAK menjalankan nginx maupun certbot
# sendiri - menghindari rebutan port dan menghemat RAM di VPS 1.7 GB.
#
# Aplikasi hanya dipublikasikan ke 127.0.0.1:3200 supaya nginx host bisa
# mem-proxy-nya, tetapi port itu tidak terbuka ke internet.
#
#   sudo docker compose -f docker-compose.deploy.yml --env-file .env.docker up -d
#
# Migrasi WAJIB dijalankan lebih dulu lewat profil `tools`:
#   sudo docker compose -f docker-compose.deploy.yml --env-file .env.docker \
#     run --rm --no-deps migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
    volumes:
      - rmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # Hanya localhost: dipakai untuk diagnosis dan migrasi lewat tunnel SSH.
      - "127.0.0.1:${PG_HOST_PORT:-5439}:5432"
    networks:
      - internal

  # Perkakas sekali-pakai: migrasi database dan provisioning admin.
  # Dipisahkan karena image runtime `runner` memakai output standalone yang
  # tidak membawa Prisma CLI. Dijalankan manual, bukan bagian dari `up -d`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: rmp-lampung-migrator:latest
    profiles: ["tools"]
    # Seluruh konfigurasi (termasuk DATABASE_URL) dibaca dari berkas env,
    # bukan diinterpolasi di compose. Ini menghindari pola URL berkredensial
    # yang rawan rusak saat diformat ulang.
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET wajib diisi}
      APP_URL: ${APP_URL:?APP_URL wajib diisi}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: rmp-lampung-app:latest
    container_name: rmp_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET wajib diisi}
      APP_URL: ${APP_URL:?APP_URL wajib diisi}
      PAKASIR_MODE: ${PAKASIR_MODE:-produksi}
      PAKASIR_SLUG: ${PAKASIR_SLUG:?PAKASIR_SLUG wajib diisi}
      PAKASIR_API_KEY: ${PAKASIR_API_KEY:?PAKASIR_API_KEY wajib diisi}
      PAKASIR_BASE_URL: ${PAKASIR_BASE_URL:-https://app.pakasir.com}
      PAKASIR_WEBHOOK_SECRET: ${PAKASIR_WEBHOOK_SECRET:?PAKASIR_WEBHOOK_SECRET wajib diisi}
      SERTIFIKAT_PENANDATANGAN: ${SERTIFIKAT_PENANDATANGAN:?SERTIFIKAT_PENANDATANGAN wajib diisi}
      SERTIFIKAT_JABATAN_PENANDATANGAN: ${SERTIFIKAT_JABATAN_PENANDATANGAN:-Pemilik Rumah Mama Pintar}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
    ports:
      # Hanya loopback: dipakai untuk diagnosis dari dalam VPS.
      - "127.0.0.1:${APP_HOST_PORT:-3200}:3000"
    networks:
      internal:
      # Jaringan milik stack serbamager; nginx-nya ada di sini sehingga bisa
      # menjangkau app lewat nama alias tanpa perlu host-gateway.
      web:
        aliases:
          - rmp-app

networks:
  internal:
  web:
    external: true
    name: serbamager_default

volumes:
  rmp_pgdata:
