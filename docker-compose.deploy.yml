# Deployment produksi RMP Lampung — MANDIRI di VPS terpisah.
#
# Tidak bergantung pada stack lain: stack ini membawa Postgres, aplikasi,
# nginx, dan certbot sendiri. Nol persentuhan dengan serbamager.
#
#   cp .env.docker.example .env.docker && nano .env.docker
#   sudo docker compose -f docker-compose.deploy.yml --env-file .env.docker up -d --build
#
# TLS diterbitkan dalam DUA langkah karena nginx tidak mau start bila
# ssl_certificate menunjuk berkas yang belum ada:
#   1) salin nginx/http-only.conf ke ~/rmp-lampung/nginx/default.conf, start
#   2) terbitkan sertifikat lewat profil `tls`, lalu ganti ke nginx/tls.conf
#      dan `up -d --force-recreate nginx`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
    volumes:
      - rmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Tidak dipublikasikan ke host: hanya app yang perlu menjangkaunya.
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmp-lampung-app:latest
    container_name: rmp_app
    restart: unless-stopped
    # Aplikasi hanya start setelah database benar-benar siap; tanpa ini
    # Next.js bisa boot lalu gagal melayani server action.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:***@postgres:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET wajib diisi}
      APP_URL: ${APP_URL:?APP_URL wajib diisi}
      PAKASIR_MODE: ${PAKASIR_MODE:-produksi}
      PAKASIR_SLUG: ${PAKASIR_SLUG:?PAKASIR_SLUG wajib diisi}
      PAKASIR_API_KEY: ${PAKASIR_API_KEY:?PAKASIR_API_KEY wajib diisi}
      PAKASIR_BASE_URL: ${PAKASIR_BASE_URL:-https://app.pakasir.com}
      PAKASIR_WEBHOOK_SECRET: ${PAKASIR_WEBHOOK_SECRET:?PAKASIR_WEBHOOK_SECRET wajib diisi}
      SERTIFIKAT_PENANDATANGAN: ${SERTIFIKAT_PENANDATANGAN:?SERTIFIKAT_PENANDATANGAN wajib diisi}
      SERTIFIKAT_JABATAN_PENANDATANGAN: ${SERTIFIKAT_JABATAN_PENANDATANGAN:-Pemilik Rumah Mama Pintar}
      # Hanya dipakai sekali oleh `npm run admin:provision`, tidak dibaca
      # saat melayani permintaan.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
    networks:
      - internal
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: rmp_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Berkas konfigurasi di-swap manual antara http-only.conf dan tls.conf.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web

  # Certbot hanya dijalankan manual lewat profil `tls`, bukan service tetap.
  certbot:
    image: certbot/certbot:latest
    container_name: rmp_certbot
    profiles: ["tls"]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    # entrypoint image ini adalah /bin/sh -c, jadi perintah harus dikirim
    # sebagai SATU argumen; argumen terpisah akan dibaca sebagai $0.
    entrypoint: ["/bin/sh", "-c"]

networks:
  internal:
  web:

volumes:
  rmp_pgdata:
  certbot-conf:
