# Vhost RMP Lampung untuk nginx serbamager (tahap HTTP).
# Blok ini DITAMBAHKAN ke ~/serbamager/nginx/default.conf, tidak menggantikan.
# RMP di-proxy lewat port loopback host karena container tidak sejaringan.

# --- HTTP: RMP Lampung (termasuk jalur challenge ACME) ---
server {
    listen 80;
    listen [::]:80;
    server_name rumahmamapintar.my.id www.rumahmamapintar.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://rmp-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }
}
