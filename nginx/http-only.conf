# Tahap 1: HTTP saja.
# Nginx tidak mau start bila ssl_certificate menunjuk berkas yang belum ada,
# jadi konfigurasi ini dipakai lebih dulu untuk membuka port 80 dan
# memvalidasi domain, baru setelah sertifikat terbit diganti ke tls.conf.

server {
	listen 80;
	listen [::]:80;
	server_name rumahmamapintar.my.id www.rumahmamapintar.my.id;

	# Jalur challenge ACME untuk penerbitan/perpanjangan sertifikat.
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		proxy_pass http://app:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Wajib: tanpa ini aplikasi tidak tahu skema aslinya dan redirect
		# yang dibangun dari request.url bisa mengarah ke 0.0.0.0:3000.
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 300s;
	}
}
