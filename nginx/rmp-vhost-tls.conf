# Vhost RMP Lampung untuk nginx serbamager (tahap TLS).
# Pakai SETELAH sertifikat rumahmamapintar.my.id terbit:
#   1) ganti blok HTTP RMP di ~/serbamager/nginx/default.conf dengan blok
#      HTTP di bawah (yang mengalihkan ke HTTPS), lalu TAMBAHKAN blok 443.
#   2) nginx -t && nginx -s reload
# Sertifikat memakai volume serbamager_letsencrypt yang sama.

# --- HTTP: alihkan ke HTTPS, tetap layani challenge ACME ---
server {
    listen 80;
    listen [::]:80;
    server_name rumahmamapintar.my.id www.rumahmamapintar.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: RMP Lampung ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rumahmamapintar.my.id www.rumahmamapintar.my.id;

    ssl_certificate     /etc/letsencrypt/live/rumahmamapintar.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rumahmamapintar.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://rmp-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }
}
