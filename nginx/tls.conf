# Tahap 2: TLS. Dipakai SETELAH sertifikat Let's Encrypt terbit.

server {
	listen 80;
	listen [::]:80;
	server_name rumahmamapintar.my.id www.rumahmamapintar.my.id;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name rumahmamapintar.my.id www.rumahmamapintar.my.id;

	ssl_certificate     /etc/letsencrypt/live/rumahmamapintar.my.id/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/rumahmamapintar.my.id/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;

	client_max_body_size 12m;

	location / {
		proxy_pass http://app:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 300s;
	}
}
